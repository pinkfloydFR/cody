server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml;

    # Tout est local, aucun script en ligne ni eval. « unsafe-inline » ne vaut que pour les styles :
    # Blockly insère sa feuille de style dans la page.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    # Le navigateur revérifie à chaque visite : une mise à jour est vue sans Ctrl+F5
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
