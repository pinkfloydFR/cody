<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Cody — essai de rendu 3D (jetable)</title>
<link rel="icon" href="data:,">
<style>
  @font-face{font-family:Luciole;src:url(../../fonts/Luciole-Bold.woff2) format("woff2");font-weight:700}
  html,body{margin:0;height:100%;background:#1a2029;overflow:hidden}
  canvas{display:block;cursor:grab}
  p{position:fixed;left:12px;bottom:8px;margin:0;color:#c9d4e3;font:14px Luciole,sans-serif}
</style>
</head>
<body>
<p id="note">Essai jetable : fais glisser pour tourner la vue.</p>
<!-- Essai seulement : la bibliothèque vient d'Internet. Une version intégrée serait copiée dans le projet. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(async () => {
await document.fonts.load("700 40px Luciole").catch(() => {});
const T = THREE;
const rendu = new T.WebGLRenderer({ antialias: true });
rendu.setPixelRatio(Math.min(devicePixelRatio, 2));
rendu.shadowMap.enabled = true;
rendu.shadowMap.type = T.PCFSoftShadowMap;
rendu.outputEncoding = T.sRGBEncoding;
rendu.toneMapping = T.ACESFilmicToneMapping;
rendu.toneMappingExposure = .86;
document.body.prepend(rendu.domElement);
const monde = new T.Scene();
monde.background = new T.Color(0x1a2029);
monde.fog = new T.Fog(0x1a2029, 28, 55);

/* ---------- Textures dessinées dans le code ---------- */
let graine = 7;
const hasard = () => (graine = (graine * 16807) % 2147483647) / 2147483647;
function texture(l, h, dessin, rx = 1, ry = 1, couleur = true) {
  const c = document.createElement("canvas"); c.width = l; c.height = h;
  dessin(c.getContext("2d"), l, h);
  const t = new T.CanvasTexture(c);
  t.wrapS = t.wrapT = T.RepeatWrapping; t.repeat.set(rx, ry);
  t.anisotropy = rendu.capabilities.getMaxAnisotropy();
  if (couleur) t.encoding = T.sRGBEncoding;
  return t;
}
function grain(g, l, h, n, a, taille = 2) {
  for (let i = 0; i < n; i++) {
    g.fillStyle = hasard() > .5 ? `rgba(255,255,255,${hasard() * a})` : `rgba(0,0,0,${hasard() * a})`;
    g.fillRect(hasard() * l, hasard() * h, 1 + hasard() * taille, 1 + hasard() * taille);
  }
}
function rayures(g, l, h, n, coul, long = 40) {
  g.strokeStyle = coul;
  for (let i = 0; i < n; i++) {
    const x = hasard() * l, y = hasard() * h;
    g.lineWidth = .4 + hasard();
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + (hasard() - .5) * long, y + (hasard() - .5) * long * .3); g.stroke();
  }
}
const beton = texture(1024, 1024, (g, l, h) => {
  g.fillStyle = "#8b8e90"; g.fillRect(0, 0, l, h);
  for (let i = 0; i < 260; i++) {
    const x = hasard() * l, y = hasard() * h, r = 20 + hasard() * 130;
    const d = g.createRadialGradient(x, y, 0, x, y, r), v = hasard() > .5 ? "255,255,255" : "40,36,30";
    d.addColorStop(0, `rgba(${v},.10)`); d.addColorStop(1, `rgba(${v},0)`);
    g.fillStyle = d; g.fillRect(x - r, y - r, 2 * r, 2 * r);
  }
  grain(g, l, h, 26000, .22);
  rayures(g, l, h, 160, "rgba(40,40,40,.18)", 120);
  g.strokeStyle = "rgba(30,30,30,.45)"; g.lineWidth = 4; g.strokeRect(0, 0, l, h);
}, 5, 3);
const tole = texture(512, 512, (g, l, h) => {
  for (let x = 0; x < l; x++) {
    const v = 60 + Math.sin(x / l * Math.PI * 16) * 8;
    g.fillStyle = `rgb(${v - 8},${v},${v + 12})`; g.fillRect(x, 0, 1, h);
  }
  grain(g, l, h, 5000, .10);
}, 6, 2);
const acier = (base, usure = 1) => texture(512, 512, (g, l, h) => {
  g.fillStyle = base; g.fillRect(0, 0, l, h);
  for (let i = 0; i < 1800; i++) {
    g.fillStyle = `rgba(${hasard() > .5 ? "255,255,255" : "0,0,0"},${hasard() * .06})`;
    g.fillRect(hasard() * l, hasard() * h, 40 + hasard() * 160, 1);
  }
  grain(g, l, h, 3500, .12);
  rayures(g, l, h, 70 * usure, "rgba(225,230,235,.35)");
  rayures(g, l, h, 40 * usure, "rgba(60,35,15,.35)");
});
const metal = (carte, m = .65, r = .45) => new T.MeshStandardMaterial({ map: carte, metalness: m, roughness: r });
const ACIER = metal(acier("#6f7c8c")), SOMBRE = metal(acier("#39424e"), .6, .55), CLAIR = metal(acier("#b9c0c8", .5), .85, .3);
const PETROLE = metal(acier("#157884"), .4, .45), CAOUTCHOUC = new T.MeshStandardMaterial({ color: 0x15171a, roughness: .9 });

/* ---------- Reflets : un petit atelier virtuel pour éclairer les métaux ---------- */
const pmrem = new T.PMREMGenerator(rendu), reflets = new T.Scene();
reflets.background = new T.Color(0x59636f);
for (const [x, y, z, l, h] of [[0, 9, 0, 14, 3], [-9, 4, 4, 3, 8], [9, 5, 6, 3, 6]]) {
  const p = new T.Mesh(new T.PlaneGeometry(l, h), new T.MeshBasicMaterial({ color: 0xffffff, side: T.DoubleSide }));
  p.position.set(x, y, z); p.lookAt(0, 0, 0); reflets.add(p);
}
monde.environment = pmrem.fromScene(reflets, .04).texture;

/* ---------- Outils ---------- */
function objet(geo, mat, x, y, z, parent = monde) {
  const m = new T.Mesh(geo, mat); m.position.set(x, y, z);
  m.castShadow = m.receiveShadow = true; parent.add(m); return m;
}
const bloc = (l, h, p, mat, x, y, z, parent) => objet(new T.BoxGeometry(l, h, p), mat, x, y, z, parent);
const cyl = (r, h, mat, x, y, z, parent, n = 24) => objet(new T.CylinderGeometry(r, r, h, n), mat, x, y, z, parent);
const boulon = (x, y, z) => { cyl(.055, .06, CLAIR, x, y, z, monde, 6).rotation.x = Math.PI / 2; };

/* ---------- Décor ---------- */
const sol = objet(new T.PlaneGeometry(46, 28), new T.MeshStandardMaterial({ map: beton, color: 0xa9a39a, roughness: .95, envMapIntensity: .35 }), 0, 0, 0);
sol.rotation.x = -Math.PI / 2;
objet(new T.PlaneGeometry(46, 16), new T.MeshStandardMaterial({ map: tole, metalness: .35, roughness: .65 }), 0, 8, -7);
const danger = (rx, ry) => texture(256, 256, (g, l, h) => {
  g.fillStyle = "#e0a81e"; g.fillRect(0, 0, l, h); g.fillStyle = "#22262c";
  for (let i = -l; i < l * 2; i += 128) { g.beginPath(); g.moveTo(i, 0); g.lineTo(i + 64, 0); g.lineTo(i - h + 64, h); g.lineTo(i - h, h); g.fill(); }
  grain(g, l, h, 2500, .3);
}, rx, ry);
const peint = (rx, ry) => new T.MeshStandardMaterial({ map: danger(rx, ry), roughness: .75 });
/* Zone de sortie marquée au sol */
for (const [l, p, x, z] of [[2.9, .18, 4.5, 1.55], [2.9, .18, 4.5, -1.55], [.18, 3.28, 3.05, 0], [.18, 3.28, 5.95, 0]]) {
  bloc(l, .02, p, peint(Math.max(1, l * 2), Math.max(1, p * 2)), x, .012, z);
}

/* ---------- Portique en poutres en I ---------- */
for (const x of [-6.8, 6.8]) {
  for (const dz of [-.22, .22]) bloc(.5, 6.7, .09, ACIER, x, 3.35, dz);
  bloc(.12, 6.7, .36, SOMBRE, x, 3.35, 0);
  bloc(1.3, .16, 1.2, SOMBRE, x, .08, 0);
  bloc(.54, .5, .56, peint(1, 1), x, .62, 0);
  for (const dx of [-.5, .5]) for (const dz of [-.45, .45]) cyl(.08, .1, CLAIR, x + dx, .2, dz, monde, 6);
  for (let y = 1.3; y < 6.2; y += .8) for (const dx of [-.16, .16]) boulon(x + dx, y, .29);
}
for (const y of [6.38, 6.92]) bloc(14.4, .1, .62, ACIER, 0, y, 0);
bloc(14.4, .46, .14, SOMBRE, 0, 6.65, 0);
for (let x = -6.2; x <= 6.2; x += 1.55) bloc(.07, .46, .5, ACIER, x, 6.65, 0);
for (let x = -7; x <= 7; x += .62) boulon(x, 6.92, .33);

/* ---------- Postes ---------- */
function plaque(texte, l = 1.1) {
  const t = texture(512, 160, (g, w, h) => {
    g.fillStyle = "#e9ebe6"; g.fillRect(0, 0, w, h); grain(g, w, h, 900, .12);
    g.strokeStyle = "#20262e"; g.lineWidth = 12; g.strokeRect(10, 10, w - 20, h - 20);
    g.fillStyle = "#20262e"; g.font = "700 96px Luciole, sans-serif"; g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText(texte, w / 2, h / 2 + 6);
  });
  return [new T.PlaneGeometry(l, l * .3125), new T.MeshStandardMaterial({ map: t, roughness: .6 })];
}
const POSTES = { "1": -4.5, "2": -1.5, "3": 1.5, SORTIE: 4.5 };
for (const [nom, x] of Object.entries(POSTES)) {
  bloc(2.3, .18, 1.85, ACIER, x, .55, 0);
  bloc(2.14, .02, 1.7, CAOUTCHOUC, x, .65, 0);
  for (const dx of [-.98, .98]) for (const dz of [-.75, .75]) bloc(.16, .48, .16, SOMBRE, x + dx, .24, dz);
  objet(...plaque(nom, nom.length > 1 ? 1.5 : 1.05), x, .24, 1.0);
}

/* ---------- Caisses en bois peint, cornières en acier ---------- */
const L = 1.85, H = 1.1, P = 1.5;
function bois(g, l, h, teinte) {
  g.fillStyle = teinte; g.fillRect(0, 0, l, h);
  const n = 4, e = h / n;
  for (let i = 0; i < n; i++) {
    g.fillStyle = `rgba(${hasard() > .5 ? "255,255,255" : "0,0,0"},${.03 + hasard() * .07})`; g.fillRect(0, i * e, l, e);
    for (let k = 0; k < 26; k++) {
      const y = i * e + hasard() * e;
      g.strokeStyle = `rgba(30,15,5,${.08 + hasard() * .2})`; g.lineWidth = .6 + hasard() * 1.8;
      g.beginPath(); g.moveTo(0, y);
      for (let x = 0; x <= l; x += 40) g.lineTo(x, y + Math.sin(x / 90 + k) * 3 * hasard());
      g.stroke();
    }
    for (let k = 0; k < 2; k++) {
      const x = hasard() * l, y = i * e + e * (.25 + hasard() * .5);
      for (let r = 12; r > 2; r -= 3) { g.strokeStyle = "rgba(35,18,6,.28)"; g.beginPath(); g.ellipse(x, y, r * 1.8, r * .6, 0, 0, 7); g.stroke(); }
    }
    g.fillStyle = "rgba(0,0,0,.5)"; g.fillRect(0, i * e, l, 4);
    g.fillStyle = "rgba(255,255,255,.16)"; g.fillRect(0, i * e + 4, l, 2);
  }
  /* Peinture écaillée : le bois nu réapparaît */
  for (let i = 0; i < 150; i++) {
    const bord = hasard() > .35;
    const x = bord ? (hasard() > .5 ? hasard() * 40 : l - hasard() * 40) : hasard() * l, y = hasard() * h;
    g.fillStyle = `rgba(184,140,88,${.25 + hasard() * .5})`;
    g.beginPath(); g.ellipse(x, y, 1 + hasard() * 7, .8 + hasard() * 2.5, hasard() * .5, 0, 7); g.fill();
  }
  rayures(g, l, h, 90, "rgba(240,225,200,.28)", 70);
  grain(g, l, h, 7000, .14);
}
function faceCaisse(teinte, lettre, nom) {
  return new T.MeshStandardMaterial({ roughness: .72, metalness: .05, map: texture(740, 440, (g, l, h) => {
    bois(g, l, h, teinte);
    if (!lettre) return;
    const x = l / 2 - 150, y = h / 2 - 135;
    g.fillStyle = "#efeadb"; g.fillRect(x, y, 300, 270); grain(g, l, h, 900, .1);
    g.strokeStyle = "rgba(30,30,30,.55)"; g.lineWidth = 5; g.strokeRect(x + 10, y + 10, 280, 250);
    g.fillStyle = "#191d24"; g.textAlign = "center"; g.textBaseline = "middle";
    g.font = "700 150px Luciole, sans-serif"; g.fillText(lettre, l / 2, y + 108);
    g.font = "700 54px Luciole, sans-serif"; g.fillText(nom, l / 2, y + 218);
  }) });
}
function caisse(x, y, teinte, lettre, nom) {
  const g = new T.Group(); g.position.set(x, y, 0); monde.add(g);
  const nu = faceCaisse(teinte), marque = faceCaisse(teinte, lettre, nom);
  bloc(L, H, P, [nu, nu, nu, nu, marque, nu], 0, H / 2, 0, g);
  const e = .1;
  for (const sy of [e / 2, H - e / 2]) for (const sz of [-P / 2, P / 2]) bloc(L + .04, e, e, SOMBRE, 0, sy, sz, g);
  for (const sy of [e / 2, H - e / 2]) for (const sx of [-L / 2, L / 2]) bloc(e, e, P + .04, SOMBRE, sx, sy, 0, g);
  for (const sx of [-L / 2, L / 2]) for (const sz of [-P / 2, P / 2]) {
    bloc(e, H, e, SOMBRE, sx, H / 2, sz, g);
    for (const sy of [e / 2, H - e / 2]) objet(new T.SphereGeometry(.042, 12, 10), CLAIR, sx, sy, sz + Math.sign(sz) * .052, g);
  }
}
caisse(-4.5, .66, "#2f66ad", "A", "bleue");
caisse(-4.5, .66 + H + .03, "#b23b2e", "B", "rouge");

/* ---------- Chariot, câbles et pince ---------- */
const cx = -1.9, haut = 3.85;
bloc(1.7, .55, 1.15, PETROLE, cx, 5.98, 0);
bloc(1.72, .1, 1.17, peint(5, 1), cx, 5.68, 0);
for (const dx of [-.55, .55]) for (const dz of [-.43, .43]) {
  cyl(.2, .14, CAOUTCHOUC, cx + dx, 6.28, dz).rotation.x = Math.PI / 2;
  cyl(.08, .17, CLAIR, cx + dx, 6.28, dz).rotation.x = Math.PI / 2;
}
const tambour = cyl(.22, .8, CLAIR, cx, 5.55, 0); tambour.rotation.z = Math.PI / 2;
objet(new T.SphereGeometry(.07, 16, 12), new T.MeshStandardMaterial({ color: 0x37d67a, emissive: 0x1fae5c, emissiveIntensity: 1.4 }), cx + .6, 6.0, .6);
for (const dx of [-.26, .26]) cyl(.025, 5.4 - haut - .62, SOMBRE, cx + dx, (5.4 + haut + .62) / 2, 0);
bloc(.85, .34, .55, metal(acier("#d79a1d"), .45, .45), cx, haut + .45, 0);
bloc(2.35, .18, .62, PETROLE, cx, haut + .2, 0);
const verin = cyl(.07, 1.5, CLAIR, cx, haut + .36, .22); verin.rotation.z = Math.PI / 2;
const porte = haut - H - .02;
for (const s of [-1, 1]) {
  bloc(.14, 1.05, .8, PETROLE, cx + s * 1.07, haut - .35, 0);
  bloc(.07, .55, .66, CAOUTCHOUC, cx + s * .985, haut - .58, 0);
  bloc(.26, .1, .8, SOMBRE, cx + s * .96, haut - .93, 0);
  objet(new T.SphereGeometry(.09, 16, 12), CLAIR, cx + s * 1.07, haut + .14, .34);
}
caisse(cx, porte, "#a67f0c", "C", "jaune");

/* ---------- Lumières ---------- */
monde.add(new T.HemisphereLight(0xdfe9f5, 0x40382c, .45));
const soleil = new T.DirectionalLight(0xfff1dd, 1.35);
soleil.position.set(-6, 14, 9); soleil.castShadow = true;
soleil.shadow.mapSize.set(2048, 2048); soleil.shadow.bias = -.0004; soleil.shadow.radius = 4;
Object.assign(soleil.shadow.camera, { left: -12, right: 12, top: 12, bottom: -6, near: 1, far: 40 });
monde.add(soleil);
const appoint = new T.PointLight(0x9fc4ff, .5, 30); appoint.position.set(9, 6, 5); monde.add(appoint);

/* ---------- Caméra : presque de face pour que les piles restent lisibles ---------- */
const camera = new T.PerspectiveCamera(32, 1, .1, 100);
let angle = .17, hauteur = .2;
function dessiner() {
  const l = innerWidth, h = innerHeight;
  rendu.setSize(l, h);
  camera.aspect = l / h;
  const d = Math.max(18.5, 31 / camera.aspect);
  camera.position.set(Math.sin(angle) * d * Math.cos(hauteur), 3.2 + Math.sin(hauteur) * d, Math.cos(angle) * d * Math.cos(hauteur));
  camera.lookAt(0, 3.1, 0);
  camera.updateProjectionMatrix();
  rendu.render(monde, camera);
}
let glisse = null;
rendu.domElement.addEventListener("pointerdown", (e) => { glisse = [e.clientX, e.clientY]; rendu.domElement.setPointerCapture(e.pointerId); });
rendu.domElement.addEventListener("pointermove", (e) => {
  if (!glisse) return;
  angle = Math.max(-.7, Math.min(.7, angle - (e.clientX - glisse[0]) * .004));
  hauteur = Math.max(.03, Math.min(.6, hauteur + (e.clientY - glisse[1]) * .003));
  glisse = [e.clientX, e.clientY]; dessiner();
});
rendu.domElement.addEventListener("pointerup", () => { glisse = null; });
addEventListener("resize", dessiner);
dessiner();
})();
</script>
</body>
</html>
