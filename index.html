<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cody — Traçage</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="tortue.css">
</head>
<body>
<header class="barre">
  <h1>Cody</h1>
  <nav class="onglets" aria-label="Ateliers">
    <a href="index.html" aria-current="page">Traçage</a>
    <a href="manutention.html">Manutention</a>
  </nav>
  <!-- Le programme en Python : dans la barre, pour laisser la place à la scène -->
  <details class="menu menu-python">
    <summary aria-label="Programme en Python" title="Ton programme en Python"><svg class="logo-python" viewBox="0 0 32 32" aria-hidden="true"><path fill="#3776ab" d="M15.8 2c-6.9 0-6.5 3-6.5 3v3.1h6.6V9H6.7S2 8.5 2 15.9s4.1 7.1 4.1 7.1h2.4v-3.4s-.1-4.1 4-4.1h6.9s3.9.1 3.9-3.8V5.2S23.9 2 15.8 2zm-3.8 2.2a1.25 1.25 0 1 1 0 2.5 1.25 1.25 0 0 1 0-2.5z"/><path fill="#ffd43b" d="M16.2 30c6.9 0 6.5-3 6.5-3v-3.1h-6.6V23h9.2s4.7.5 4.7-6.9-4.1-7.1-4.1-7.1h-2.4v3.4s.1 4.1-4 4.1h-6.9s-3.9-.1-3.9 3.8v6.5S8.1 30 16.2 30zm3.8-2.2a1.25 1.25 0 1 1 0-2.5 1.25 1.25 0 0 1 0 2.5z"/></svg></summary>
    <div class="menu-liste python-in">
      <button class="btn btn-mini" id="copier" type="button">Copier</button>
      <pre><code id="code-python"></code></pre>
    </div>
  </details>
  <!-- PDF de l'élève et espace prof (boutons créés par atelier.js) -->
  <div class="outils-export" id="outils-export"></div>
  <nav class="niveaux" id="niveaux" aria-label="Niveaux"></nav>
</header>

<main class="jeu">
  <section class="carte" aria-labelledby="titre-prog">
    <div class="carte-tete">
      <h2 id="titre-prog">Ton programme</h2>
      <button class="btn btn-mini btn-nettoyer" id="nettoyer" type="button" title="Supprimer les blocs grisés, qui ne sont pas accrochés à DÉPART">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l1 2h4v2H4V5h4zM6 9h12l-1 12H7z"/></svg>
        <span>Supprimer les blocs grisés</span>
      </button>
      <span class="compteur" id="compteur">0 bloc</span>
    </div>
    <div id="blockly" class="zone-blocs"></div>
  </section>

  <section class="carte carte-travail" aria-labelledby="titre-niveau">
    <div class="consigne">
      <p class="niv-num" id="niv-num">Niveau 1</p>
      <div class="titre-ligne"><h2 id="titre-niveau">Le carré</h2>
        <button class="btn-indice" id="indice" type="button" aria-label="Un indice ?" title="Un indice ?"><span aria-hidden="true">?</span></button></div>
      <p id="texte-niveau"></p>
      <ul class="bareme" id="bareme" aria-label="Barème"></ul>
    </div>
    <div class="plateau">
      <div class="scene" id="scene">
        <canvas id="c-fond" width="800" height="800" aria-hidden="true"></canvas>
        <canvas id="c-encre" width="800" height="800" aria-hidden="true"></canvas>
        <canvas id="c-dessus" width="800" height="800" role="img" aria-label="Zone de dessin"></canvas>
      </div>
    </div>
    <dl class="releve">
      <div><dt>x</dt><dd id="etat-x">0</dd></div>
      <div><dt>y</dt><dd id="etat-y">0</dd></div>
      <div><dt>cap</dt><dd id="etat-cap">0°</dd></div>
      <div><dt>crayon</dt><dd id="etat-stylo">baissé</dd></div>
    </dl>
    <div class="commandes">
      <button class="btn btn-go" id="lancer" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12.5-7.5z"/></svg>
        <span>Exécuter</span>
      </button>
      <button class="btn btn-sec" id="effacer" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5a7 7 0 1 1-6.6 4.7l1.9.6A5 5 0 1 0 12 7v3L7.5 6 12 2z"/></svg>
        <span>Réinitialiser</span>
      </button>
      <button class="btn btn-sec btn-vider" id="vider" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l1 2h4v2H4V5h4zM6 9h12l-1 12H7z"/></svg>
        <span>Recommencer le niveau</span>
      </button>
      <label class="vitesse">Vitesse
        <input type="range" id="vitesse" min="1" max="5" value="3">
      </label>
    </div>
    <div class="verdict info" id="verdict" aria-live="polite"></div>
  </section>
</main>

<script src="js/blockly_compressed.js"></script>
<script src="js/blockly-fr.js"></script>
<script src="js/export-pdf.js"></script>
<script src="js/atelier.js"></script>
<script src="js/tortue.js"></script>
</body>
</html>
